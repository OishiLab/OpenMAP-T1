[project]
name = "openmap-t1"
version = "0.1.0"
description = "A Rapid Deep-Learning Approach to Parcellate 280 Anatomical Regions to Cover the Whole Brain"
requires-python = ">=3.11"
dependencies = [
    "nibabel==5.4.2",
    "pandas==3.0.3",
    "scipy==1.17.1",
    "SimpleITK==2.5.5",
    "torch>=2.12.0",
    "torchaudio>=2.11.0",
    "torchvision>=0.27.0",
    "tqdm==4.68.2",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
